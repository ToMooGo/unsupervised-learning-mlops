# python run_flow.py --config configs/monitor_flow_config.yaml
extends: full_flow_config.yaml
flow: monitor

monitor:
  window_hours: 168                  # look at the last 7 days of predictions
  min_predictions: 20                # too few requests -> no verdict
  max_anomaly_rate_pct: 12.0         # 3x the expected 4 % -> inputs have drifted
  max_class_share_pct: 40.0          # one digit dominating predictions is suspicious
